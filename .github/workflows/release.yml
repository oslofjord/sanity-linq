name: Release

# Publishing:
#  - Publish a GitHub Release (tag vX.Y.Z or vX.Y.Z-rc.N) -> the package is packed
#    at that exact version and pushed to NuGet.org via OIDC Trusted Publishing.
#    A SemVer pre-release suffix (e.g. -rc.1) lands on NuGet's prerelease channel.
#  - Run manually (workflow_dispatch) -> packs a "-dev.N" build to GitHub Packages
#    for quick local testing (no NuGet.org publish).
# Trusted Publishing policy required on nuget.org: Repository Owner = oslofjord,
# Repository = sanity-linq, Workflow File = release.yml. Secret NUGET_USER = your
# nuget.org username.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Compute package version and target
        id: pkg
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Tag drives the version, e.g. v1.8.0 or v1.8.0-rc.1
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "target=nuget" >> "$GITHUB_OUTPUT"
          else
            base=$(grep -oPm1 '(?<=<Version>)[^<]+' src/Sanity.Linq/Sanity.Linq.csproj)
            echo "version=${base}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "target=github" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack src/Sanity.Linq/Sanity.Linq.csproj -c Release -p:PackageVersion=${{ steps.pkg.outputs.version }} -p:GeneratePackageOnBuild=false -o ./artifacts

      - name: Push dev prerelease to GitHub Packages
        if: ${{ steps.pkg.outputs.target == 'github' }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/oslofjord/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: NuGet login (OIDC trusted publishing)
        if: ${{ steps.pkg.outputs.target == 'nuget' }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: ${{ steps.pkg.outputs.target == 'nuget' }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
