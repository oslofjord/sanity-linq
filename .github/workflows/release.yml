name: Release

# Publishing is manual — run this workflow from the Actions tab.
#  - default: packs a "-dev.N" prerelease and pushes it to GitHub Packages for testing.
#  - check "publish_nuget": packs the csproj version and publishes it to NuGet.org
#    via OIDC Trusted Publishing (no stored API key). Requires a Trusted Publishing
#    policy on nuget.org: Repository Owner = oslofjord, Repository = sanity-linq,
#    Workflow File = release.yml. Set secret NUGET_USER to your nuget.org username.
on:
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: 'Publish stable package to NuGet.org (otherwise a dev prerelease goes to GitHub Packages)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read base version from csproj
        id: base
        run: echo "version=$(grep -oPm1 '(?<=<Version>)[^<]+' src/Sanity.Linq/Sanity.Linq.csproj)" >> "$GITHUB_OUTPUT"

      - name: Compute package version
        id: pkg
        run: |
          set -euo pipefail
          if [[ "${{ inputs.publish_nuget }}" == "true" ]]; then
            echo "version=${{ steps.base.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.base.outputs.version }}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack src/Sanity.Linq/Sanity.Linq.csproj -c Release -p:PackageVersion=${{ steps.pkg.outputs.version }} -p:GeneratePackageOnBuild=false -o ./artifacts

      - name: Push dev prerelease to GitHub Packages
        if: ${{ ! inputs.publish_nuget }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/oslofjord/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: NuGet login (OIDC trusted publishing)
        if: ${{ inputs.publish_nuget }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push stable to NuGet.org
        if: ${{ inputs.publish_nuget }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
