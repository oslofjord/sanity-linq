name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore sanity-linq.sln

      - name: Build
        run: dotnet build sanity-linq.sln -c Release --no-restore -p:GeneratePackageOnBuild=false

      # Offline tests: no credentials, no network, non-destructive. These are the golden
      # suite that pins GROQ / mutation payload / HTML output, plus the Newtonsoft
      # compatibility tests. The core test project is filtered because its other classes
      # are live integration tests (see the integration-tests job below).
      - name: Test (offline)
        run: |
          set -euo pipefail
          dotnet test tests/Sanity.Linq.Tests/Sanity.Linq.Tests.csproj \
            -c Release --no-build --verbosity normal \
            --filter "FullyQualifiedName~Sanity.Linq.Tests.Golden"
          dotnet test tests/Sanity.Linq.Newtonsoft.Tests/Sanity.Linq.Newtonsoft.Tests.csproj \
            -c Release --no-build --verbosity normal

      - name: Scan for vulnerable packages
        run: |
          set -euo pipefail
          output=$(dotnet list sanity-linq.sln package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Pack
        run: |
          set -euo pipefail
          for project in src/Sanity.Linq/Sanity.Linq.csproj src/Sanity.Linq.Newtonsoft/Sanity.Linq.Newtonsoft.csproj; do
            dotnet pack "$project" -c Release --no-build -p:GeneratePackageOnBuild=false -o ./artifacts
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

  # Integration tests hit a live Sanity project and are destructive (they delete
  # all documents in the dataset). Opt-in only: set repo variable
  # RUN_INTEGRATION_TESTS=true and provide the SANITY_* secrets. They never run on
  # pull requests (which can't access secrets and may come from forks).
  integration-tests:
    if: github.event_name == 'push' && github.repository == 'oslofjord/sanity-linq' && vars.RUN_INTEGRATION_TESTS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Test
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: dotnet test sanity-linq.sln -c Release --verbosity normal
