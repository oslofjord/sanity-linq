version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Shipped runtime dependency of a netstandard2.0 library: keep the floor low
      # and let consumers float up. Security patches still come through.
      - dependency-name: "Microsoft.Extensions.Http"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
